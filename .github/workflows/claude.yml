# Claude on GitHub for Làng Vọng (this repo only). How to use it: docs/ASK_CLAUDE.md
#
# Write "@claude ..." in an issue, an issue comment, a pull request comment or a review, and Claude answers there.
# If you ask for a change, Claude commits it to a new branch named claude/... and posts a link to open a pull request.
# It never merges and never pushes to main: a person reviews and merges.
#
# Safety:
# - Runs on GitHub's machines, not on anyone's computer. Its GitHub token works for this repo only and expires after the run.
# - Only people with write access to this repo can trigger it (the action checks; the `if:` below checks again).
# - No web browsing (no WebFetch / WebSearch): text from the web can't steer it.
# - It can't open Roblox Studio, so it can't run tools/factory/test.py. Run the tests yourself before merging its work.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# one run at a time per issue / pull request
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # the week's usage so far (kept in the Actions cache, one entry per run; nothing is committed)
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Load this week's usage
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .claude-usage
          key: claude-usage-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: claude-usage-${{ steps.week.outputs.week }}-

      - name: Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Pick ONE of these two secrets (docs/ASK_CLAUDE.md, step 2): the repo owner's own plan or key. Leave the other unset.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: main
          branch_prefix: claude/
          # the model: repo variable CLAUDE_MODEL (Settings -> Secrets and variables -> Actions -> Variables), Opus 5.5 if unset
          claude_args: |
            --max-turns 15
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --disallowedTools WebFetch,WebSearch
            --append-system-prompt "You are running as the @claude bot on GitHub for the Làng Vọng repo. Follow CLAUDE.md, including its section 'Running as the GitHub bot'. Work on this repo only. Never merge, never push to main, never touch .github/workflows. There is no Roblox Studio here: you cannot run tools/factory/test.py, so say clearly that the tests still have to be run by a person."

      # Budget guard: add this run's cost to the week's total, project it to the end of the week (Sunday, UTC) at the
      # current rate, and if that crosses the weekly budget (repo variable WEEKLY_BUDGET_USD, default 40) post one
      # heads-up a day in the thread: stop for the week, or switch to Sonnet. With a subscription token the cost is
      # Claude Code's API-price estimate, used as a gauge of how fast the week's allowance is going.
      - name: Budget guard
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          BUDGET: ${{ vars.WEEKLY_BUDGET_USD || '40' }}
          MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          OWNER: ${{ github.repository_owner }}
          THREAD: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          mkdir -p .claude-usage
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess
          ledger_path = pathlib.Path(".claude-usage/ledger.json")
          ledger = json.loads(ledger_path.read_text()) if ledger_path.exists() else {"runs": [], "warned": ""}
          cost, minutes = 0.0, 0.0
          try:
              msgs = json.loads(pathlib.Path(os.environ.get("EXEC_FILE") or "none").read_text())
              res = [m for m in msgs if isinstance(m, dict) and m.get("type") == "result"]
              if res:
                  cost = float(res[-1].get("total_cost_usd") or 0)
                  minutes = float(res[-1].get("duration_ms") or 0) / 60000
          except Exception as e:
              print("no execution file:", e)
          now = datetime.datetime.now(datetime.timezone.utc)
          ledger["runs"].append({"t": now.isoformat(), "usd": round(cost, 4), "min": round(minutes, 2), "model": os.environ["MODEL"]})
          spent = sum(r["usd"] for r in ledger["runs"])
          monday = (now - datetime.timedelta(days=now.weekday())).replace(hour=0, minute=0, second=0, microsecond=0)
          elapsed = max((now - monday).total_seconds() / 3600, 6)  # (at least 6 h, so one early run doesn't look like a flood)
          projected = spent / elapsed * 168
          budget = float(os.environ["BUDGET"])
          print(f"this run ${cost:.2f}, {minutes:.1f} min; week so far ${spent:.2f} in {len(ledger['runs'])} runs; "
                f"projected ${projected:.2f} of ${budget:.0f}")
          today = now.strftime("%Y-%m-%d")
          if projected > budget and ledger.get("warned") != today and os.environ.get("THREAD"):
              hours_left = max((budget - spent) / (spent / elapsed), 0) if spent > 0 else 0
              runs_out = now + datetime.timedelta(hours=hours_left)
              sonnet = "already on Sonnet" if "sonnet" in os.environ["MODEL"] else "switch to Sonnet"
              body = (f"@{os.environ['OWNER']} heads-up from the Claude bot about this week's usage: about ${spent:.0f} of the "
                      f"${budget:.0f} weekly budget is used ({len(ledger['runs'])} requests since Monday). At this rate it runs "
                      f"out around {runs_out.strftime('%A %H:%M')} UTC, before the week ends.\n\n"
                      f"To stay inside it: pause the bigger requests until Monday, or {sonnet} (repo Settings → Secrets and "
                      f"variables → Actions → Variables → `CLAUDE_MODEL` = `claude-sonnet-5-5`; delete it to go back to Opus). "
                      f"The budget itself is the `WEEKLY_BUDGET_USD` variable.")
              subprocess.run(["gh", "issue", "comment", os.environ["THREAD"], "--repo", os.environ["GITHUB_REPOSITORY"], "--body", body])
              ledger["warned"] = today
          ledger_path.write_text(json.dumps(ledger))
          PY
      - name: Save this week's usage
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .claude-usage
          key: claude-usage-${{ steps.week.outputs.week }}-${{ github.run_id }}
